version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tripnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripnow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tripnow}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tripnow}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tripnow-net

  redis:
    image: redis:7-alpine
    container_name: tripnow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - tripnow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tripnow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripnow}:${POSTGRES_PASSWORD:-tripnow_dev_password}@postgres:5432/${POSTGRES_DB:-tripnow}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-too}
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - tripnow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tripnow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tripnow-net

volumes:
  postgres-data:
  redis-data:

networks:
  tripnow-net:
    driver: bridge
